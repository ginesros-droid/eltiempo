<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Tiempo - Ginés Ros 26</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="Logo%20Senderismo%20con%20humor.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error en Service Worker:', err));
            });
        }

        // Lógica del botón de instalación
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('btn-install');
            installBtn.classList.remove('hidden'); // Mostrar botón si es instalable
            
            installBtn.addEventListener('click', () => {
                installBtn.classList.add('hidden');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            });
        });

        // 45 municipios de la Región de Murcia
        const municipalities = [
            { id: "abanilla", name: "Abanilla", lat: 38.2038, lon: -1.0411 },
            { id: "abaran", name: "Abarán", lat: 38.2045, lon: -1.3992 },
            { id: "aguilas", name: "Águilas", lat: 37.4062, lon: -1.5833 },
            { id: "albudeite", name: "Albudeite", lat: 38.0289, lon: -1.3853 },
            { id: "alcantarilla", name: "Alcantarilla", lat: 37.9731, lon: -1.2114 },
            { id: "aledo", name: "Aledo", lat: 37.7933, lon: -1.5739 },
            { id: "alguazas", name: "Alguazas", lat: 38.0519, lon: -1.2417 },
            { id: "alhama", name: "Alhama de Murcia", lat: 37.8508, lon: -1.4253 },
            { id: "archena", name: "Archena", lat: 38.1158, lon: -1.2997 },
            { id: "beniel", name: "Beniel", lat: 38.0469, lon: -1.0017 },
            { id: "blanca", name: "Blanca", lat: 38.1783, lon: -1.3761 },
            { id: "bullas", name: "Bullas", lat: 38.0442, lon: -1.6703 },
            { id: "calasparra", name: "Calasparra", lat: 38.2311, lon: -1.6978 },
            { id: "campos_rio", name: "Campos del Río", lat: 38.0381, lon: -1.3533 },
            { id: "caravaca", name: "Caravaca de la Cruz", lat: 38.1067, lon: -1.8622 },
            { id: "cartagena", name: "Cartagena", lat: 37.6051, lon: -0.9862 },
            { id: "cehegin", name: "Cehegín", lat: 38.0925, lon: -1.7997 },
            { id: "ceuti", name: "Ceutí", lat: 38.0786, lon: -1.2725 },
            { id: "cieza", name: "Cieza", lat: 38.2403, lon: -1.4181 },
            { id: "fortuna", name: "Fortuna", lat: 38.1794, lon: -1.1247 },
            { id: "fuente_alamo", name: "Fuente Álamo de Murcia", lat: 37.7264, lon: -1.1714 },
            { id: "jumilla", name: "Jumilla", lat: 38.4739, lon: -1.3253 },
            { id: "la_union", name: "La Unión", lat: 37.6200, lon: -0.8753 },
            { id: "torres_cotillas", name: "Las Torres de Cotillas", lat: 38.0283, lon: -1.2422 },
            { id: "librilla", name: "Librilla", lat: 37.8864, lon: -1.3514 },
            { id: "lorca", name: "Lorca", lat: 37.6712, lon: -1.7017 },
            { id: "lorqui", name: "Lorquí", lat: 38.0811, lon: -1.2508 },
            { id: "los_alcazares", name: "Los Alcázares", lat: 37.7444, lon: -0.8525 },
            { id: "mazarron", name: "Mazarrón", lat: 37.5986, lon: -1.3150 },
            { id: "molina", name: "Molina de Segura", lat: 38.0522, lon: -1.2131 },
            { id: "moratalla", name: "Moratalla", lat: 38.1883, lon: -1.8906 },
            { id: "mula", name: "Mula", lat: 38.0422, lon: -1.4900 },
            { id: "murcia", name: "Murcia", lat: 37.9870, lon: -1.1300 },
            { id: "ojos", name: "Ojós", lat: 38.1472, lon: -1.3411 },
            { id: "pliego", name: "Pliego", lat: 37.9892, lon: -1.5036 },
            { id: "puerto_lumbreras", name: "Puerto Lumbreras", lat: 37.5622, lon: -1.8089 },
            { id: "ricote", name: "Ricote", lat: 38.1539, lon: -1.3653 },
            { id: "sangonera", name: "Sangonera la Seca (pedanía de Murcia)", lat: 37.9500, lon: -1.2000 },
            { id: "san_javier", name: "San Javier", lat: 37.8064, lon: -0.8353 },
            { id: "san_pedro", name: "San Pedro del Pinatar", lat: 37.8354, lon: -0.7915 },
            { id: "santomera", name: "Santomera", lat: 38.0617, lon: -1.0489 },
            { id: "torre_pacheco", name: "Torre-Pacheco", lat: 37.7431, lon: -0.9536 },
            { id: "totana", name: "Totana", lat: 37.7708, lon: -1.5000 },
            { id: "ulea", name: "Ulea", lat: 38.1381, lon: -1.3325 },
            { id: "villanueva", name: "Villanueva del Río Segura", lat: 38.1369, lon: -1.3283 },
            { id: "yecla", name: "Yecla", lat: 38.6139, lon: -1.1167 }
        ];

        let weatherCache = {};

        function getWeatherMeta(code) {
            if (code === 0) return { icon: '☀️', text: 'Despejado' };
            if ([1, 2].includes(code)) return { icon: '🌤️', text: 'Poco nuboso' };
            if (code === 3) return { icon: '☁️', text: 'Nublado' };
            if ([45, 48].includes(code)) return { icon: '🌫️', text: 'Niebla' };
            if ([51, 53, 55, 56, 57].includes(code)) return { icon: '🌦️', text: 'Llovizna' };
            if ([61, 63, 65, 66, 67].includes(code)) return { icon: '🌧️', text: 'Lluvia' };
            if ([80, 81, 82].includes(code)) return { icon: '🌦️', text: 'Chubascos' };
            if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: 'Tormenta' };
            return { icon: '⛅', text: 'Variable' };
        }

        function populateDateSelector() {
            const select = document.getElementById('day-select');
            select.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 15; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const isoDate = date.toISOString().split('T')[0];
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                let label = date.toLocaleDateString('es-ES', options);
                label = label.charAt(0).toUpperCase() + label.slice(1);
                if (i === 0) label += " (Hoy)";
                const opt = document.createElement('option');
                opt.value = isoDate;
                opt.textContent = label;
                select.appendChild(opt);
            }
        }

        function populateMunicipalities() {
            const select = document.getElementById('location-select');
            select.innerHTML = '';
            municipalities.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                if (m.id === 'alcantarilla') opt.selected = true;
                select.appendChild(opt);
            });
        }

        async function fetchWeatherData(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_probability_max,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=16&timezone=Europe%2FMadrid`;
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        async function updateData() {
            const locationId = document.getElementById('location-select').value;
            const selectedDate = document.getElementById('day-select').value;
            const mun = municipalities.find(m => m.id === locationId);

            document.getElementById('result-location').innerText = mun.name;
            const selectedOpt = document.getElementById('day-select').options[document.getElementById('day-select').selectedIndex];
            document.getElementById('result-day').innerText = selectedOpt ? selectedOpt.text : selectedDate;

            if (!weatherCache[locationId]) {
                weatherCache[locationId] = await fetchWeatherData(mun.lat, mun.lon);
            }

            const data = weatherCache[locationId];
            if (!data) return;

            const dailyIndex = data.daily.time.indexOf(selectedDate);
            if (dailyIndex !== -1) {
                const maxProb = data.daily.precipitation_probability_max[dailyIndex];
                const weatherCode = data.daily.weather_code[dailyIndex];
                const meta = getWeatherMeta(weatherCode);

                document.getElementById('result-value').innerText = `${maxProb}%`;
                document.getElementById('result-symbol').innerText = meta.icon;
                document.getElementById('result-condition').innerText = meta.text;
            }

            const hourlyContainer = document.getElementById('hourly-timeline');
            hourlyContainer.innerHTML = '';

            data.hourly.time.forEach((t, idx) => {
                if (t.startsWith(selectedDate)) {
                    const hourStr = t.split('T')[1].substring(0, 5);
                    const prob = data.hourly.precipitation_probability[idx];
                    const temp = Math.round(data.hourly.temperature_2m[idx]);
                    const code = data.hourly.weather_code[idx];
                    const meta = getWeatherMeta(code);

                    const hourCard = document.createElement('div');
                    hourCard.className = "flex-none w-20 bg-gray-50 border border-gray-200 rounded-xl p-3 text-center flex flex-col items-center justify-between shadow-sm";
                    hourCard.innerHTML = `
                        <span class="text-xs font-semibold text-gray-500">${hourStr}</span>
                        <span class="text-2xl my-1">${meta.icon}</span>
                        <span class="text-sm font-bold text-gray-800">${temp}°C</span>
                        <span class="text-xs font-semibold text-blue-600 mt-1">💧 ${prob}%</span>
                    `;
                    hourlyContainer.appendChild(hourCard);
                }
            });

            document.getElementById('last-updated').innerText = `Última actualización: ${new Date().toLocaleTimeString()}`;
        }

        window.onload = () => {
            populateMunicipalities();
            populateDateSelector();
            updateData();
        };
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Botón de instalación (Oculto por defecto) -->
        <div class="flex justify-end">
            <button id="btn-install" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-full shadow-lg transition flex items-center gap-2">
                📲 Instalar App en el Móvil
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-200">
            <div class="flex justify-center mb-6">
                <!-- Archivo con espacios codificados (%20) -->
                <img src="Logo%20Senderismo%20con%20humor.jpg" alt="Senderismo con humor" class="h-32 w-32 object-cover rounded-full shadow-md border-2 border-blue-100">
            </div>
            
            <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
            <h1 class="text-center leading-none" style="font-family:'Chewy','Comic Sans MS',cursive;font-size:3.5rem;color:#3b82f6;text-shadow:3px 3px 0 #fbbf24;transform:rotate(-2deg);">El Tiempo</h1>
            <p class="text-sm font-bold text-gray-700 mb-6 text-center" style="font-family:Verdana,Arial,sans-serif;">Ginés Ros 26</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1" for="location-select">Municipio:</label>
                    <select id="location-select" onchange="updateData()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1" for="day-select">Día:</label>
                    <select id="day-select" onchange="updateData()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 border-t-4 border-blue-500 border-x border-b border-gray-200 text-center">
            <p class="text-gray-500 font-medium text-sm" id="result-day">---</p>
            <h2 class="text-2xl font-bold text-gray-800 my-1" id="result-location">---</h2>
            
            <div class="flex items-center justify-center space-x-3 my-3">
                <span class="text-5xl" id="result-symbol">☀️</span>
                <span class="text-6xl font-black text-blue-600" id="result-value">--%</span>
            </div>
            
            <p class="text-sm font-semibold text-gray-600" id="result-condition">---</p>
            <p class="text-xs text-gray-400 mt-1">Probabilidad máxima de lluvia registrada en la jornada</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>🕒</span> Predicción por Horas
            </h3>
            <div id="hourly-timeline" class="flex overflow-x-auto gap-3 pb-2 scrollbar-thin">
            </div>
        </div>

        <div class="text-center text-gray-400 text-xs space-y-1">
            <p id="last-updated">Cargando datos...</p>
            <p>Modelos meteorológicos en tiempo real (Open-Meteo API)</p>
            <p class="font-medium text-gray-500 mt-2">Diseño.- Ginés Ros 2026</p>
        </div>
    </div>
</body>
</html>
